# Explicit DSH headless overlay for the Strata relay used by the user's web profile.
# Pass this with --dsh-patch. It never edits the user's DSH profile.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      strata-relay:
        displayName: Strata relay
        apiKeyEnv: ATM_API_KEY
        api: openai-responses
        baseURL: !!js process.env.STRATA_DSH_BASE_URL ?? 'http://129.28.27.137:8888/v1'
        models:
          - id: qwen3.8-flash-next-iq3_xxs-abliterated
            name: Qwen3.8-Flash-Next IQ3_XXS
            contextWindow: 256000
            maxTokens: 32000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: xhigh
              xhigh: xhigh
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: strata-relay
    model: qwen3.8-flash-next-iq3_xxs-abliterated
    reasoningEffort: high
